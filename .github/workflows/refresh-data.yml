# 定时更新 Skill 库数据
# 静态站无后端，数据层 assets/data.js 必须由采集服务生成并提交回仓库，
# Netlify 监听到推送后自动重新部署。

name: Refresh Skill Data

on:
  schedule:
    # 每天 UTC 03:10（北京时间 11:10）执行，避开整点高峰
    - cron: "10 3 * * *"
  # 手动触发（Actions 页面 Run workflow）
  workflow_dispatch:

# 同一时间只允许一个任务运行，避免并发提交冲突
concurrency:
  group: refresh-skill-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        # 采集器仅依赖标准库，无需 pip install。
        # secrets.GITHUB_TOKEN 由 Actions 自动注入，配额 1000 次/小时。
        # 若需更高配额，可在仓库 Secrets 中配置 GITHUB_TOKEN 覆盖。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          cd collector
          python run.py 2>&1 | tee collect.log

      - name: Check for changes
        id: check
        run: |
          # 不能直接用 git diff：data.js 头部有生成时间戳，
          # 且每条记录带「15 天前」这类相对天数，每天都在变。
          # naive diff 会让 CI 每天提交一次无意义 commit。
          # 这里改比内容指纹——排除易变时间字段后完全一致，
          # 说明索引内容确实没变。
          NEW=$(grep -oP '内容指纹：\K\S+' assets/data.js || true)
          OLD=$(git show HEAD:assets/data.js 2>/dev/null \
                | grep -oP '内容指纹：\K\S+' || true)

          echo "旧指纹: ${OLD:-<无>}"
          echo "新指纹: ${NEW:-<无>}"

          if [ -z "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未读到内容指纹，跳过提交以免破坏仓库状态"
          elif [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "索引内容未变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- assets/data.js
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js
          git commit -m "chore(data): refresh skill index [skip ci]"
          # Actions 产出的提交回推时可能与新触发产生竞态，
          # 用 --force-with-lease 语义安全的重试掩盖瞬时拒绝。
          git push || {
            echo "::warning::push 被拒绝，10 秒后重试一次"
            sleep 10
            git pull --rebase --autostash origin main
            git push
          }