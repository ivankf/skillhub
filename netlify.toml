# SkillHub — Netlify 部署配置
# 纯静态站，无构建步骤。
#
# 用构建命令把真正需要的文件拷到 dist/ 再发布，
# 而不是直接 publish = "."。后者会把 collector/*.py、
# deploy.sh、push.sh、README.md 全部暴露到线上——headers 只能加
# 响应头和缓存策略，拦不住文件访问。文件不存在才是真拦截。

[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist && cp -r index.html assets dist/"

# 全局安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 数据层由采集服务生成（GitHub Actions 每日更新），缓存时间短，
# 保证用户能较快拿到最新技能库
[[headers]]
  for = "/assets/data.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/app.js"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/assets/style.css"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

# 第三方库，版本固定（文件名不带版本号，靠内容指纹发布）
[[headers]]
  for = "/assets/marked.min.js"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"